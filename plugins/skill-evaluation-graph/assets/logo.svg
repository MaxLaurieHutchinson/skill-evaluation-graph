<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGradient)" stroke="#334155" stroke-width="6" />

  <!-- Background Graph Network Lines -->
  <g opacity="0.35" stroke="#475569" stroke-width="2">
    <line x1="80" y1="100" x2="256" y2="50" />
    <line x1="432" y1="100" x2="256" y2="50" />
    <line x1="80" y1="380" x2="256" y2="450" />
    <line x1="432" y1="380" x2="256" y2="450" />
  </g>

  <!-- Active Evaluation DAG Edges -->
  <g stroke-linecap="round">
    <path d="M 140 160 L 372 160" stroke="#334155" stroke-width="6" stroke-dasharray="8 8" />
    <path d="M 140 160 L 256 290" stroke="url(#blueGlow)" stroke-width="8" filter="url(#glow)" />
    <path d="M 372 160 L 256 290" stroke="url(#purpleGlow)" stroke-width="8" filter="url(#glow)" />
    <path d="M 256 290 L 256 370" stroke="url(#greenGlow)" stroke-width="8" filter="url(#glow)" />
  </g>

  <!-- DAG Nodes -->
  <!-- Left Diagnostic Node -->
  <circle cx="140" cy="160" r="36" fill="#1E293B" stroke="url(#blueGlow)" stroke-width="6" />
  <circle cx="140" cy="160" r="14" fill="#38BDF8" />

  <!-- Right Behavioral Pressure Node -->
  <circle cx="372" cy="160" r="36" fill="#1E293B" stroke="url(#purpleGlow)" stroke-width="6" />
  <circle cx="372" cy="160" r="14" fill="#A855F7" />

  <!-- Join / Verifier Node -->
  <circle cx="256" cy="290" r="44" fill="#0F172A" stroke="url(#greenGlow)" stroke-width="7" />
  <path d="M 240 290 L 252 302 L 274 278" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Terminal Output Anchor Node -->
  <circle cx="256" cy="370" r="16" fill="#34D399" />
</svg>
