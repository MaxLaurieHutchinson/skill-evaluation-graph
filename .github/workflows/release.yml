name: Release SEG

on:
  workflow_run:
    workflows: ["Test and Validate SEG"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: seg-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Create or update Release PR / publish merged release
        id: release
        uses: release-please-oss/release-please-action@7a6e2d3ff9e08fbd69d0430e4be5d90a3e96c28c
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Check out released tag
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plugins/skill-evaluation-graph/requirements.txt

      - name: Revalidate exact release tree
        if: ${{ steps.release.outputs.release_created }}
        run: |
          python -m unittest discover -s plugins/skill-evaluation-graph/tests
          python -m unittest discover -s plugins/skill-evaluation-graph/scripts
          python plugins/skill-evaluation-graph/scripts/audit_skill.py plugins/skill-evaluation-graph --verbose
          python scripts/validate_release.py

      - name: Build deterministic release assets
        if: ${{ steps.release.outputs.release_created }}
        run: python scripts/build_release.py --version "${{ steps.release.outputs.version }}" --output-dir dist

      - name: Upload release assets
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" dist/skill.zip "dist/skill-evaluation-graph-v${{ steps.release.outputs.version }}.zip" dist/SHA256SUMS.txt --clobber
